<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAN Screen Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <video id="screen" autoplay playsinline muted tabindex="0"></video>
    <div id="placeholder">
      <p class="title">Remote Mac display</p>
      <p class="hint" id="placeholder-hint">Connecting…</p>
    </div>
    <header id="hud">
      <div id="status" class="pill idle" data-state="idle">idle</div>
      <div class="hud-actions">
        <button type="button" id="btn-connect">Connect</button>
        <button type="button" id="btn-disconnect" hidden>Disconnect</button>
        <button type="button" id="btn-fs" title="Fullscreen">Fullscreen</button>
      </div>
    </header>
    <div id="banner" hidden></div>
    <div id="lock-tools" hidden>
      <p id="focus-hint">If the screen is locked, click once then type your Mac password and press Enter (picture stays black until unlocked).</p>
      <form id="unlock-bar">
        <input type="password" id="unlock-pass" name="unlock" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Mac password" />
        <button type="submit" id="btn-unlock">Unlock</button>
      </form>
    </div>
    <button type="button" id="btn-clip" hidden>Clipboard updated — click to apply</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
